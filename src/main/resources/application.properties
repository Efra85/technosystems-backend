spring.application.name=backend-core
# Nome da aplicação no ecossistema
spring.application.name=backend-core

# =====================================================================
# ENGENHARIA DE ELITE: ATIVANDO AS VIRTUAL THREADS (PROJECT LOOM)
# =====================================================================
# Isso faz com que cada requisição HTTP rode em uma thread leve do Java,
# permitindo lidar com milhões de conexões simultâneas sem estourar a RAM.
spring.threads.virtual.enabled=true

# Port do servidor backend para não conflitar com o Next.js (que usa a 3000)
server.port=8080

# =====================================================================
# PERSISTÊNCIA REATIVA (R2DBC para PostgreSQL)
# =====================================================================
# Repare no prefixo "r2dbc" em vez de "jdbc". Isso garante I/O não-bloqueante.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/technosystems_db
spring.r2dbc.username=postgres
spring.r2dbc.password=suasenha

# Pooling reativo de conexões (Substituto do HikariCP tradicional para R2DBC)
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50